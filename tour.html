<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tirta Senja Resort – Virtual Tour</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="tour-toolbar">
  <button class="btn sec" id="tour-prev" hidden>↩ Sebelumnya</button>
  <a href="index.html" class="btn sec" id="tour-back">← Kembali</a>
</div>
<div id="panorama" style="width: 100%; height: 100vh;"></div>
<div id="tour-menu"></div>
<div id="scene-title"></div>

<div id="tour-controls">
  <button id="ctrl-zoom-in" title="Perbesar">+</button>
  <button id="ctrl-zoom-out" title="Perkecil">−</button>
  <button id="ctrl-fullscreen" title="Layar penuh">⛶</button>
  <div id="ctrl-compass" title="Arah hadap">
    <img id="compass-needle" src="img/compass-needle.png" alt="">
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<script src="js/data-tour.js"></script>
<script src="js/tour.js"></script>
</body>
</html>
