<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Demo website pemesanan hotel: cari kamar, hitung harga, dan buat pesanan. Proyek portofolio front-end.">
<title>Tirta Senja Resort – Pesan Kamar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wrap">
  <div id="header-placeholder"></div>

  <main>
    <section class="hero">
      <h1>Menginap di antara sawah dan sungai</h1>
      <p>Pilih tanggal, lihat kamar yang tersedia, dan dapatkan kode pesanan dalam hitungan detik.</p>
      <div class="search" role="search">
        <div class="field"><label for="ci">Check-in</label><input type="date" id="ci"></div>
        <div class="field"><label for="co">Check-out</label><input type="date" id="co"></div>
        <div class="field"><label for="ad">Tamu dewasa</label><select id="ad"></select></div>
        <div class="field"><label for="rm">Jumlah kamar</label><select id="rm"></select></div>
        <button class="btn" id="go">Cari kamar</button>
      </div>
      <div class="err" id="serr" role="alert"></div>
    </section>

    <div class="bar">
      <div class="chips" id="chips"></div>
      <select class="sort" id="sort" aria-label="Urutkan kamar">
        <option value="price-asc">Harga terendah</option>
        <option value="price-desc">Harga tertinggi</option>
        <option value="capacity">Kapasitas terbesar</option>
      </select>
    </div>
    <div class="grid" id="grid" aria-live="polite"></div>
  </main>

  <!-- <footer>Proyek demo portofolio. Tidak ada pembayaran atau pemesanan nyata.</footer> -->
</div>

<dialog id="dlg"><div class="dg" id="dgc"></div></dialog>

<!-- Urutan penting: setiap file memakai file di atasnya. -->
<script src="js/partials.js"></script>
<script src="js/data.js"></script>
<script src="js/booking.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
