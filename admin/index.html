<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tirta Senja Resort – Admin</title>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div class="wrap">
  <h1>Admin Panel — Kelola Kamar</h1>
  <p class="meta">Halaman ini belum ada login/proteksi apa pun -- siapa saja yang tahu alamatnya bisa tambah/hapus kamar. Jangan dipakai di situs publik sungguhan sebelum ditambah autentikasi.</p>

  <section style="margin: 24px 0;">
    <h2>Tambah Kamar Baru</h2>
    <form id="room-form">
      <div class="field"><label for="f-name">Nama kamar</label><input id="f-name" required></div>
      <div class="field">
        <label for="f-type">Tipe</label>
        <select id="f-type">
          <option>Standar</option>
          <option>Deluxe</option>
          <option>Suite</option>
          <option>Villa</option>
        </select>
      </div>
      <div class="field"><label for="f-cap">Kapasitas tamu</label><input id="f-cap" type="number" min="1" value="2" required></div>
      <div class="field"><label for="f-bed">Konfigurasi tempat tidur</label><input id="f-bed" required></div>
      <div class="field"><label for="f-size">Luas (m²)</label><input id="f-size" type="number" min="1" required></div>
      <div class="field"><label for="f-price">Harga per malam (Rp)</label><input id="f-price" type="number" min="0" required></div>
      <div class="field"><label for="f-available">Stok kamar</label><input id="f-available" type="number" min="0" value="1" required></div>
      <div class="field"><label for="f-perks">Fasilitas (pisahkan dengan koma)</label><input id="f-perks" placeholder="AC, Wi-Fi, Sarapan"></div>
      <div style="margin: 24px 0; display: flex; gap: 8px;">
        <button id="form-submit" class="btn" type="submit">Simpan Kamar</button>
        <button id="form-cancel" class="btn sec" type="button" hidden>Batal</button>
      </div>
      <div class="err" id="form-msg" role="alert"></div>
    </form>
  </section>

  <section>
    <h2>Daftar Kamar</h2>
    <div id="room-list"></div>
  </section>
</div>

<script src="../js/ui.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
